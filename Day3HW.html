<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Contact Card</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f2f2f2;
    }

    /* Fixed Header */
    header{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        background:#003366;
        color:white;
        text-align:center;
        padding:15px;
        font-size:24px;
        font-weight:bold;
        z-index:1000;
    }

    /* Profile Section */
    .profile{
        position:relative;
        width:80%;
        height:250px;
        margin:100px auto;
        background:white;
        border:2px solid #333;
        overflow:auto;
        padding:20px;
    }

    /* Profile Image */
    .profile img{
        float:left;
        width:150px;
        height:150px;
        margin-right:20px;
        border-radius:10px;
    }

    /* Profile Text */
    .details{
        text-align:center;
        margin-right:220px;
    }

    /* Contact Info Box */
    .contact{
        position:absolute;
        top:20px;
        right:20px;
        width:180px;
        text-align:center;
        border-left:3px solid black;   /* Vertical Line */
        padding-left:15px;
    }

    h2,h3,p{
        margin:10px;
    }
</style>
</head>

<body>

<!-- Fixed Header -->
<header>
    Company Contact Card
</header>

<!-- Profile Section -->
<div class="profile">

    <!-- Employee Image -->
    <img src="https://via.placeholder.com/150" alt="Employee Photo">

    <!-- Employee Details -->
    <div class="details">
        <h2>John Smith</h2>
        <h3>Software Engineer</h3>
        <p>
            John is an experienced software engineer specializing in
            web development and cloud technologies. He enjoys solving
            complex problems and building user-friendly applications.
        </p>
    </div>

    <!-- Contact Information -->
    <div class="contact">
        <h3>Contact Info</h3>
        <p><strong>Phone:</strong><br>+91 9876543210</p>
        <p><strong>Email:</strong><br>johnsmith@email.com</p>
    </div>

</div>

</body>
</html>
